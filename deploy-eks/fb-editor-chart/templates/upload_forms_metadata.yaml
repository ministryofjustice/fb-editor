apiVersion: batch/v1
kind: CronJob
metadata:
  name: fb-editor-cron-upload-forms-metadata-{{ .Values.environmentName }}
  namespace: formbuilder-saas-{{ .Values.environmentName }}
spec:
  schedule: "0 20 * * *"
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            upload-forms-metadata: cronjob
        spec:
          containers:
            - name: "fb-editor-workers-{{ .Values.environmentName }}"
              image: "754256621582.dkr.ecr.eu-west-2.amazonaws.com/formbuilder/fb-editor-workers:{{ .Values.circleSha1 }}"
              args:
              - /bin/sh
              - -c
              - bundle exec rails aws:s3:upload_forms_metadata
              securityContext:
                runAsUser: 1001
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: fb-editor-config-map
              env:
                - name: AWS_S3_METADATA_BACKUP_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: fb-editor-secrets-{{ .Values.environmentName }}
                      key: aws_s3_metadata_backup_bucket
                - name: PLATFORM_ENV
                  value: {{ .Values.environmentName }}
          restartPolicy: Never
